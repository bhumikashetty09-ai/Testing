<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24121f">
<title>For Vikki ❤️</title>
<style>
:root{--bg:#24121f;--bg2:#351827;--ivory:#fff8ef;--muted:#ead8d0;--gold:#e7c98a;--rose:#b96b7d;--glass:rgba(255,248,239,.08);--line:rgba(231,201,138,.32)}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0%,#4b2032 0,#24121f 48%,#170c15 100%);color:var(--ivory);font-family:Georgia,'Times New Roman',serif} body{overflow-x:hidden}
button,input{font:inherit}.app{min-height:100vh;display:flex;justify-content:center}.screen{width:min(100%,520px);min-height:100vh;padding:28px 20px 34px;display:none;position:relative;align-items:center;justify-content:center;text-align:center}.screen.active{display:flex;animation:fade .65s ease}.inner{width:100%;position:relative;z-index:2}.eyebrow{font:600 11px/1.4 Arial,sans-serif;letter-spacing:3px;text-transform:uppercase;color:var(--gold);opacity:.9;margin-bottom:15px}.title{font-size:clamp(34px,10vw,54px);line-height:1.03;margin:0 0 18px;font-weight:500}.copy{font-size:18px;line-height:1.75;color:var(--muted);white-space:pre-line;margin:0 auto 22px;max-width:470px}.small{font-size:14px;line-height:1.6;color:#d9c3bd}.btn{border:1px solid var(--line);background:linear-gradient(180deg,rgba(231,201,138,.18),rgba(231,201,138,.07));color:var(--ivory);padding:13px 22px;border-radius:999px;margin:7px;cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.18);transition:.2s}.btn:hover{transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,#d7b66d,#9e526a);border-color:transparent}.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:14px}.photo-card{margin:18px auto 22px;max-width:440px}.photo-card img{width:100%;height:auto;max-height:62vh;object-fit:contain;display:block;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.34);background:#130b11}.caption{font-size:14px;color:var(--gold);font-style:italic;margin-top:10px}.dots{display:flex;justify-content:center;gap:6px;margin:10px}.dot{width:6px;height:6px;border-radius:50%;background:#8c6470}.dot.on{background:var(--gold)}.heart{position:fixed;pointer-events:none;z-index:20;animation:float 2.2s ease-out forwards;font-size:20px}.panda{font-size:76px;margin:8px}.card{background:var(--glass);border:1px solid rgba(231,201,138,.16);border-radius:24px;padding:24px;backdrop-filter:blur(8px);box-shadow:0 20px 60px rgba(0,0,0,.2)}input[type=range]{width:90%;accent-color:var(--gold)}.infinity{font-size:72px;color:var(--gold);line-height:1;margin:10px}.slider-value{font-size:18px;color:var(--muted)}.voice{border:1px solid var(--line);border-radius:26px;padding:30px 18px;background:rgba(255,255,255,.04)}.mic{font-size:54px}.final-heart{font-size:72px;animation:pulse 1.6s infinite}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes float{0%{transform:translateY(0) scale(.8);opacity:1}100%{transform:translateY(-180px) translateX(var(--x)) rotate(20deg);opacity:0}}@keyframes pulse{50%{transform:scale(1.13)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body><main class="app" id="app"></main>
<script>
const P='photos/';
const screens=[];
function add(html,init){screens.push({html,init});}
function photo(src,cap){return `<div class="photo-card"><img src="${P+src}" alt=""><div class="caption">${cap||''}</div></div>`}
add(`<div class="inner"><div class="eyebrow">For my favourite person</div><h1 class="title">Hey Vikki… ❤️</h1><p class="copy">I couldn’t give this to you in person today, so I made something instead.\n\nIt’s a little collection of memories, feelings, stupid moments and everything that makes us… us.\n\nDon’t rush through it.\nTake your time. 🫶🏻</p><button class="btn primary" data-next>Tap to begin ❤️</button></div>`);
add(`<div class="inner"><div class="eyebrow">One memory I’ll always keep</div>${photo('first_meet_1.jpg','Somewhere, our story began. ❤️')}${photo('first_meet_2.jpg','And somehow, that first meeting became unforgettable.') }<p class="copy">I still remember those shivering hands, that nervous heart and all the questions running through my mind.\n\nIt was my first time meeting someone like this… and honestly, I had no idea what that moment was going to become.\n\nBut somehow, that first meeting became something I’ll never forget.\n\nI didn’t know it then, but I was meeting someone who would slowly become such a huge part of my life. ❤️</p><button class="btn primary" data-love>Do you love me? ❤️</button><div id="loveChoices"></div></div>` ,()=>{});
add(`<div class="inner"><div class="eyebrow">Just a few things I notice</div><p class="copy">There are so many little things about the way you treat me that stay with me.\n\nThe way you make me feel cared for.\nThe way you notice little things.\nThe way you make me feel safe and comfortable.\nThe way you somehow know how to handle me, even when I’m being difficult. 😂\n\nThe way you randomly get me flowers, especially lotuses, and put in so much effort just to find one for me. You know how much I love them, and I don’t think you realise how much those little efforts mean to me. 🌸\n\nAnd remember that bread you got me in Ramanagar that morning? 😂 My friends were staring at both of us like, “What did we do to not get this kind of treatment?” 😂😂\n\nAnd yes… I can never forget my first diamonds. 💎\n\nNot just because they were diamonds, but because they came from you.\n\nIt’s moments like these that make me realise how lucky I am to be loved by you. ❤️</p>${photo('affection_1.jpg','It’s always the little things. ❤️')}${photo('ramnagar_1.jpg','That Ramanagar bread moment. 😂')}${photo('ramnagar_2.jpg','My friends were definitely watching. 😂😂')}</div>`);
add(`<div class="inner"><div class="eyebrow">Be honest 😂</div><h2 class="title" style="font-size:36px">Rate me out of 10.</h2><div class="card"><input id="rating" type="range" min="1" max="10" value="10"><div class="slider-value">Your answer: <span id="rv">10</span></div><div id="inf"></div></div><button class="btn primary" data-next id="ratingNext" style="display:none">Continue ❤️</button></div>`,()=>{const r=document.getElementById('rating'),v=document.getElementById('rv'),inf=document.getElementById('inf'),n=document.getElementById('ratingNext');r.oninput=()=>v.textContent=r.value;r.onchange=()=>{inf.innerHTML='<div class="infinity">∞</div><p class="copy">Obviously. 😌<br>Some things just can’t be measured.<br>Infinity/10. ❤️</p><p class="small">“Are you Wi-Fi? Because I’m feeling a connection.” 😌😂</p>';n.style.display='inline-block';}});
add(`<div class="inner"><div class="eyebrow">A few places, a lot of us</div><p class="copy">Some of my favourite memories with you aren’t really about the place.\n\nThey’re about how I felt when I was there with you.\n\nFrom the madness of climbing mountains to the calm of just spending a day together…\n\nour trips have given me some of the happiest memories. ❤️</p>${photo('pondy_1.jpg','Pondy — our first trip and the best one to always remember. ❤️')}${photo('pondy_2.jpg','Unforgettable memories. ❤️')}${photo('coorg_1.jpg','Coorg — just two of us, new place, new people, just vibing through it all and just happy.')}${photo('coorg_2.jpg','Just us, somewhere new. 🫶🏻')}${photo('sakleshpur_1.jpg','Sakleshpur — crazy me, bothered you, divine calling as well, chaos with memories. 😂🙏🏻')}${photo('sakleshpur_2.jpg','And somehow, the chaos became a memory worth keeping.')}${photo('harishchandragad_1.jpg','Harishchandragad — we really thought we were ready for this. 😂')}${photo('harishchandragad_2.jpg','Tired legs, happy hearts. Definitely worth every step. ⛰️❤️')}${photo('mysore_1.jpg','Mysore — just you. Just me. No rush. 🌸')}${photo('mysore_2.jpg','Somewhere between all these little moments, I felt completely at peace.')}${photo('cute_4.jpg','Different places, different days…')}${photo('cute_5.jpg','…but my favourite part was always having you beside me. ❤️')}<p class="copy">Harishchandragad gave me adventure.\n\nMysore gave me calm.\n\nAnd all these trips gave me something much more important —\n\nmore memories with you. ❤️\n\nAnd honestly, that’s what makes any place special.</p><button class="btn primary" data-next>Continue ❤️</button></div>`);
add(`<div class="inner"><div class="eyebrow">Even when you’re not right here</div>${photo('long_distance_1.jpg','A little distance, a lot of love. ❤️')}${photo('long_distance_2.jpg','Waiting for the next hello, the next meeting, the next memory.') }<p class="copy">Long distance has never been my favourite part of loving you.\n\nThere are days when I wish you were right beside me instead of being a call away. Days when I miss the little things — seeing you, talking to you, just being around you.\n\nBut somehow, even with the distance, you still manage to feel like such a big part of my everyday life.\n\nMaybe that’s what makes us special. The miles can separate us for a while, but they never really make you feel far from my heart. ❤️</p><button class="btn primary" data-next>Continue ❤️</button></div>`);
add(`<div class="inner"><div class="eyebrow">Quick test 😂</div><h2 class="title" style="font-size:36px">Who is more annoying?</h2><div class="choices"><button class="btn" data-annoy="me">ME 😇</button><button class="btn" data-annoy="you">YOU 😌</button></div><p id="annoyResult" class="copy"></p><button class="btn primary" data-next id="annoyNext" style="display:none">Okay, continue 😂❤️</button></div>`);
add(`<div class="inner"><div class="eyebrow">One thing I know</div><h2 class="title" style="font-size:40px">You’re my human. 🥹</h2><p class="copy">You are genuinely one of the best finds in my life.\n\nI don’t think anyone could have handled me, understood me and loved me the way you do.\n\nYou make me happy.\n\nYou’re my comfort.\n\nYou give me a feeling that no one else can.\n\nI’ve had some rough months, but somehow life doesn’t feel as scary when I know you’re beside me.\n\nAnd maybe that’s what I love most…\n\nI don’t just want you for the good days.\n\nI want you beside me through all of them.\n\nYou’re my human.\n\nAnd I loveeee you so much. ❤️</p><button class="btn primary" data-next>❤️</button></div>`);
add(`<div class="inner"><div class="eyebrow">Because we are us 😂</div><p class="copy">Of course, being with you isn’t always peaceful. 😂\n\nThere are the teasing sessions.\n\nMe annoying you.\n\nMe teasing your legs and making you chase me.\n\nAnd somehow, even those stupid little moments become memories I wouldn’t trade for anything.\n\nBecause honestly…\n\njust being with you is fun. ❤️</p><div class="card"><p class="copy" style="margin-bottom:8px">Would you survive one full day without me?</p><button class="btn" data-survive="yes">YES</button><button class="btn" data-survive="no">NO</button><p id="surviveResult" class="copy"></p><button class="btn primary" data-next id="surviveNext" style="display:none">Continue ❤️</button></div></div>`);
add(`<div class="inner"><div class="eyebrow">One quiet prayer</div><p class="copy">Somewhere between all our journeys, there’s one thing I quietly keep asking God for.\n\nNot a perfect life.\n\nJust a happy one.\n\nA peaceful one.\n\nA life where we keep travelling, laughing, praying, growing and making memories together.\n\nI pray God keeps blessing us, keeps us together and gives us the kind of life where we can look back one day and say…\n\n“We really lived.” 🙏🏻❤️</p>${photo('tirupati_1.jpg','A little prayer for us. 🙏🏻')}${photo('tirupati_2.jpg','May God keep blessing our journey. ❤️')}${photo('tirupati_3.jpg','More places, more prayers, more memories.')}</div>`);
add(`<div class="inner"><div class="eyebrow">Our next little adventure?</div><h2 class="title" style="font-size:38px">Pick one ❤️</h2><div class="choices"><button class="btn" data-future="Sunrise">🌅 Sunrise</button><button class="btn" data-future="Mountains">🏔️ Mountains</button><button class="btn" data-future="Beach">🌊 Beach</button><button class="btn" data-future="Lazy day">🏡 Lazy day together</button></div><p id="futureResult" class="copy"></p><button class="btn primary" data-next id="futureNext" style="display:none">Continue ❤️</button></div>`);
add(`<div class="inner"><div class="eyebrow">Just listen to me for a minute</div><div class="voice"><div class="mic">🎙️</div><p class="copy">Okay…\n\nNo more questions.\nNo more games.\n\nJust listen to me for a minute. ❤️</p><button class="btn primary" id="voiceBtn">Tap to hear me 🎧</button><p class="small" id="voiceNote">Your voice note will be added here. ❤️</p></div><button class="btn" data-next>Okay… now you can continue. 🥺</button></div>`);
add(`<div class="inner"><div class="eyebrow">Today is about you</div><h1 class="title" style="font-size:42px">Happiest birthday, my dearest one. ❤️</h1><p class="copy">My Bangara, Bujji, Appu, Khanna, Baby…\n\nI hope this year gives you everything your heart deserves.\n\nHappiness. Success. Peace. Beautiful experiences. Good health. And so much love.\n\nI hope you keep smiling, keep dreaming and keep becoming everything you’re meant to be.\n\nAnd selfishly… I hope I get to be beside you for as many of those moments as possible.\n\nThank you for being you.\n\nThank you for making me happy.\n\nThank you for being my comfort.\n\nThank you for making ordinary days feel special just by being there.\n\nHappy birthday, my love.\n\nI loveeee you. ❤️</p><button class="btn primary" data-next>One last thing… ❤️</button></div>`);
add(`<div class="inner"><div class="eyebrow">One last question…</div><p class="copy">If you could choose one person to go through all of life’s adventures with…</p><button class="btn primary" data-next>You already know the answer ❤️</button></div>`);
add(`<div class="inner"><div class="final-heart">❤️</div><p class="copy">If I could go back and choose again…\n\nI’d still choose you.\n\nThrough every journey.\n\nEvery milestone.\n\nEvery happy day.\n\nEvery difficult day.\n\nEvery silly moment.\n\nEvery quiet moment.\n\nI’d choose you again and again.\n\nBecause somewhere along the way, you stopped being just someone I love…\n\nyou became my person. ❤️</p><h2 style="font-weight:500">Happy Birthday, Vikki.</h2><p class="small">Your Bhummu ❤️</p><p class="copy" style="margin-top:28px">Now come here… 🥺❤️<br>And give me my birthday hug.</p></div>`);
const app=document.getElementById('app');let i=0;function render(){app.innerHTML='';screens.forEach((s,k)=>{const el=document.createElement('section');el.className='screen'+(k===0?' active':'');el.innerHTML=s.html;app.appendChild(el);if(s.init)s.init()});bind();}function bind(){document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>go(1));document.querySelector('[data-love]').onclick=()=>{const c=document.getElementById('loveChoices');c.innerHTML='<div class="choices"><button class="btn primary" id="yes">YES ❤️</button><button class="btn" id="no">NO 😤</button></div><p id="loveMsg" class="small"></p>';document.getElementById('yes').onclick=()=>{hearts();document.getElementById('loveMsg').textContent='I KNEW IT. Good answer, boyfriend. You may continue. 😌❤️';setTimeout(()=>go(1),850)};document.getElementById('no').onclick=()=>{c.innerHTML='<div class="panda">🐼😤</div><p class="small">Excuse me??? Wrong answer. Think again, mister.</p><button class="btn primary" id="yes2">YES ❤️</button>';document.getElementById('yes2').onclick=()=>{hearts();go(1)}}};document.querySelectorAll('[data-annoy]').forEach(b=>b.onclick=()=>{document.getElementById('annoyResult').textContent=b.dataset.annoy==='me'?'Correct. I’m adorable. 😇❤️':'Bold of you to say that when you’re clearly the annoying one. 😌😂❤️';document.getElementById('annoyNext').style.display='inline-block'});document.querySelectorAll('[data-survive]').forEach(b=>b.onclick=()=>{document.getElementById('surviveResult').textContent=b.dataset.survive==='yes'?'Liar. 😂❤️':'Correct answer. 😌❤️';document.getElementById('surviveNext').style.display='inline-block'});document.querySelectorAll('[data-future]').forEach(b=>b.onclick=()=>{document.getElementById('futureResult').textContent=`Deal. Adding ${b.dataset.future.toLowerCase()} to our future memories. ❤️`;document.getElementById('futureNext').style.display='inline-block'});document.getElementById('voiceBtn')?.addEventListener('click',()=>document.getElementById('voiceNote').textContent='Voice note placeholder — add your recording here when it’s ready. ❤️');}
function go(d){i=Math.min(screens.length-1,i+d);document.querySelectorAll('.screen').forEach((s,k)=>s.classList.toggle('active',k===i));window.scrollTo({top:0,behavior:'smooth'});hearts(d===1?2:0)}function hearts(n=4){for(let x=0;x<n;x++){const h=document.createElement('div');h.className='heart';h.textContent=['❤️','🤍','✨','💗'][Math.floor(Math.random()*4)];h.style.left=(35+Math.random()*30)+'vw';h.style.top=(60+Math.random()*15)+'vh';h.style.setProperty('--x',(Math.random()*100-50)+'px');document.body.appendChild(h);setTimeout(()=>h.remove(),2200)}}render();
</script></body></html>
